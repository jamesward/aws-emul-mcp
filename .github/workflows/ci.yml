name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      # The same native libraries buildpack-scala-native installs on Heroku (liburing-dev makes kyo-net's io_uring shim
      # real, and project/NativeLinking.scala then links liburing.a), plus the AWS Emulator for EmulatorIntegrationTest.
      - name: Native toolchain and the AWS Emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev liburing-dev zlib1g-dev
          curl -fsSL -o /tmp/aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y /tmp/aws-emulator.deb
          aws-emulator -v
      - run: ./sbta extractSkillsJars
      - run: ./sbta "Test / compile; testFull; nativeLink"
      - name: Smoke test the native binary
        run: |
          bin=target/out/native0.5/scala-3.10.1/aws-emul-mcp/aws-emul-mcp
          PORT=8080 KYO_NET_BACKEND=epoll "$bin" &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/mcp -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q emulator_create
